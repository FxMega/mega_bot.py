name: FXMEGA v8 GOLD CARD BOT

on:
  schedule:
    # Every hour from Monday 00:00 UTC to Friday 23:59 UTC (Kampala is UTC+3)
    - cron: '0 * * * 1-5'
    # Also run every 30 mins during London/New York session
    - cron: '30 7-16 * * 1-5'
  workflow_dispatch:  # Allow manual run

jobs:
  run-fxmega:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install yfinance pandas requests pytz pillow

      - name: Restore trades memory
        run: |
          if [ -f fxmega_trades.json ]; then echo "Trades file exists"; else echo "{}" > fxmega_trades.json; fi
          if [ -f fxmega_last.json ]; then echo "Last file exists"; else echo "{}" > fxmega_last.json; fi

      - name: Run FXMEGA v8 Bot
        env:
          WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
        run: |
          python fxmega.py

      - name: Save memory files
        run: |
          git config --global user.name "fxmega-bot"
          git config --global user.email "bot@fxmega.ug"
          git add fxmega_trades.json fxmega_last.json || true
          git diff --staged --quiet || git commit -m "Update FXMEGA memory $(date -u +'%Y-%m-%d %H:%M UTC')" || true
          git push || true
