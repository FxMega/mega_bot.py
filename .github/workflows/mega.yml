name: FXMEGA V8.0 M15

on:
  schedule:
    - cron: '*/15 * * * *'  # <-- EVERY 15 MINS M15 SIGNALS
    - cron: '0 19 * * *'    # Daily 22:00 Kampala
    - cron: '0 17 * * 0'    # Weekly Sunday 20:00
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install yfinance pandas requests pytz
      - name: Run bot
        run: |
          if [ "${{ github.event.schedule }}" = "0 19 * * *" ]; then
            python mega_bot.py --daily
          elif [ "${{ github.event.schedule }}" = "0 17 * * 0" ]; then
            python mega_bot.py --weekly
          else
            python mega_bot.py
          fi
        env:
          WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
