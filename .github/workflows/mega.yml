name: FXMEGA V8.0 M15
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install yfinance pandas requests pytz

      - name: Run bot with NTFY FIX
        env:
          WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
        run: |
          echo "FORCING NTFY to gold-ai-ug-788408267"
          curl -d "✅ FXMEGA V8.0 FIXED! If you see this, workflow works" ntfy.sh/gold-ai-ug-788408267 || true
          python mega_bot.py

      - name: SAVE LAST SIGNAL - ANTI-SPAM
        run: |
          git config --global user.name "FxMega"
          git config --global user.email "bot@fxmega.ug"
          git add mega_last_signal.json || echo "no file to add"
          git diff --quiet && git diff --staged --quiet || git commit -m "Update last signal [skip ci]"
          git push || echo "nothing to push"
