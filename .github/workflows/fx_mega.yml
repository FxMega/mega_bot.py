name: FXMEGA 15 MINS

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-signals:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate signals.json
        run: |
          python - << 'PY'
          import json, datetime
          data = {
            "updated": datetime.datetime.now().isoformat(),
            "source": "FxMega 15min GitHub",
            "signals": {
              "BTC": {"type": "WAIT", "time": datetime.datetime.now().strftime("%H:%M:%S")},
              "GOLD": {"type": "WAIT", "time": datetime.datetime.now().strftime("%H:%M:%S")},
              "EURUSD": {"type": "WAIT", "time": datetime.datetime.now().strftime("%H:%M:%S")}
            }
          }
          with open("signals.json", "w") as f:
              json.dump(data, f, indent=2)
          print("signals.json created OK")
          PY

      - name: Commit
        run: |
          git config user.email "fx@mega.com"
          git config user.name "FxMega Bot"
          git add signals.json
          git diff --staged --quiet || git commit -m "FxMega 15min update"
          git push