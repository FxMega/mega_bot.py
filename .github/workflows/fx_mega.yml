name: FXMEGA UG v11.6 EARLY CATCH

on:
  schedule:
    - cron: '*/15 * * * *'  # every 15 mins
  workflow_dispatch:  # allow manual run

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install yfinance pandas requests numpy lxml

      - name: Restore trade files
        run: |
          if [ -f active_trades.json ]; then echo "trades exists"; else echo "{}" > active_trades.json; fi
          if [ -f signals_history.json ]; then echo "history exists"; else echo "[]" > signals_history.json; fi

      - name: Run Bot v11.6 RSI+OB
        run: |
          python fx_mega.py

      - name: Save trade files
        uses: actions/upload-artifact@v4
        with:
          name: trade-data-${{ github.run_number }}
          path: |
            active_trades.json
            signals_history.json
          retention-days: 30

      - name: Commit updated history (optional)
        run: |
          git config --global user.name "FXMEGA Bot"
          git config --global user.email "bot@fxmega.ug"
          git add active_trades.json signals_history.json || true
          git commit -m "v11.6 update trades $(date -u)" || echo "no changes"
          git push || echo "push failed"