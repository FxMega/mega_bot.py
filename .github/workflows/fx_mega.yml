name: FXMEGA v10.17

on:
  schedule:
    # Run every 15 minutes at :01 to allow candle close + 6s sleep
    - cron: '1,16,31,46 * * * *'
  workflow_dispatch:  # manual run button

jobs:
  run-fx:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          pip install --upgrade pip
          pip install yfinance pandas requests

      - name: Run FXMEGA v10.17
        env:
          TZ: UTC
        run: |
          echo "Starting FXMEGA v10.17 GOLD -24 + DXY + BULLS + RED NEWS + 6s"
          python fx_mega.py

      - name: Done
        run: echo "✅ DONE v10.17"