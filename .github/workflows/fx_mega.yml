name: FXMEGA UG Bot v11.4 LIVE MAX FIXED

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install yfinance pandas requests
      - run: python fx_mega.py
      - run: |
          git config --global user.name "FXMEGA Bot v11.4"
          git config --global user.email "bot@fxmega.ug"
          git add active_trades.json signals_history.json || echo "No files"
          git diff --quiet && git diff --staged --quiet || git commit -m "v11.4 matic fixed"
          git push || echo "Nothing"