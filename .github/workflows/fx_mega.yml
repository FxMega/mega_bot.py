name: 🚀 FXMEGA v10.6 Gold + 11 Pairs

on:
  schedule:
    - cron: '*/15 * * * *'  # ⏱️ Every 15 minutes
  workflow_dispatch:        # 👆 Manual run button

jobs:
  trade:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install dependencies
        run: |
          pip install yfinance pandas requests

      - name: 📂 Restore active trades
        run: |
          if [ -f active_trades.json ]; then
            echo "✅ Found existing trades"
            cat active_trades.json
          else
            echo "📝 No active trades yet"
            echo '{}' > active_trades.json
          fi

      - name: 🔥 Run FXMEGA Bot v10.6
        run: |
          python fx_mega.py

      - name: 💾 Save active trades
        run: |
          git config --global user.name "FXMEGA Bot 🤖"
          git config --global user.email "bot@fxmega.ug"
          git add active_trades.json || true
          git diff --quiet && git diff --staged --quiet || git commit -m "💰 Update trades $(date -u) 🚀"
          git push || echo "No changes to push"

      - name: ⏳ Show next run
        run: |
          echo "✅ v10.6 Done - Next run in 15 min ⏱️"
          echo "💵 DXY + 11 Pairs + 6s sleep + Emojis"

