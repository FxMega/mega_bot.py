name: 🚀 FXMEGA v10.9 M15 AutoRange + 11 Pairs

on:
  schedule:
    - cron: '*/15 * * * *'  # ⏱️ Every 15 minutes M15
  workflow_dispatch:        # 👆 Manual run button

jobs:
  trade:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install dependencies v10.9
        run: |
          pip install yfinance pandas requests numpy
          # numpy needed for ADX + BB width calc

      - name: 📂 Restore active trades
        run: |
          if [ -f active_trades.json ]; then
            echo "✅ Found existing trades"
            cat active_trades.json
          else
            echo "📝 No active trades yet - fresh start"
            echo '{}' > active_trades.json
          fi

      - name: 🔥 Run FXMEGA Bot v10.9 AutoRange
        run: |
          python fx_mega.py
          # or bot_v10_9.py if you renamed - keep same as your python file name

      - name: 💾 Save active trades + BE/Trail
        run: |
          git config --global user.name "FXMEGA Bot 🤖"
          git config --global user.email "bot@fxmega.ug"
          git add active_trades.json || true
          git diff --quiet && git diff --staged --quiet || git commit -m "💰 v10.9 ADX+Range $(date -u) 📦🚀"
          git push || echo "No changes to push"

      - name: ⏳ Show next run v10.9
        run: |
          echo "✅ v10.9 Done - AutoRange dynamic pair price, no 105.540 hardcode"
          echo "📊 ADX filter + BB squeeze + 6s sleep"
          echo "💵 DXY + 11 Pairs + MeanReversion scalps + Big Trend runners"
          echo "⏱️ Next run in 15 min"