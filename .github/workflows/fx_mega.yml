name: FXMEGA UG Bot v11.0

on:
  schedule:
    - cron: '*/15 * * * *'  # Every 15 mins - also checks for 22:00 EAT daily report
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas requests

      - name: Run FXMEGA UG Bot v11.0
        run: |
          python fx_mega.py

      - name: Save trades + history for daily report
        run: |
          git config --global user.name "FXMEGA Bot v11.0"
          git config --global user.email "bot@fxmega.ug"
          git add active_trades.json signals_history.json || echo "No files to add yet - first run"
          git diff --quiet && git diff --staged --quiet || git commit -m "v11.0 - Live price fix + ATR fix + Daily report data"
          git push || echo "Nothing to push"