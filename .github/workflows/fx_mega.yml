name: FXMEGA UG Bot v10.9

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas requests

      - name: Run bot
        run: |
          python bot.py

      - name: Save trades + history for daily report
        run: |
          git config --global user.name "FXMEGA Bot"
          git config --global user.email "bot@fxmega.ug"
          git add active_trades.json signals_history.json || echo "No history yet"
          git diff --quiet && git diff --staged --quiet || git commit -m "v10.9 Save trades + history for daily report"
          git push || echo "Nothing to push"