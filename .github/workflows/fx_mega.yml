name: FXMEGA UG v10.21 LIVE ENTRY

on:
  schedule:
        - cron: '2,17,32,47 * * * *'  # 2 min AFTER candle close = LIVE data ready
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
            - name: Checkout code
        uses: actions/checkout@v4

            - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

            - name: Install deps
        run: |
          pip install yfinance pandas requests

            - name: Run FXMEGA Bot
        run: |
          python fx_mega_fixed.py

            - name: Keep workflow alive
        run: |
          echo "✅ Bot ran at $(date) - ENTRY = LIVE"