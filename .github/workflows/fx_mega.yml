name: FXMEGA UG Bot v10.7

on:
  schedule:
    - cron: '*/15 * * * *'  # Every 15 minutes
  workflow_dispatch:  # Manual run button

jobs:
  run-bot:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install yfinance pandas requests

      - name: Run bot
        run: |
          python fx_mega.py

      - name: Save active trades
        run: |
          git config --global user.name "FXMEGA Bot"
          git config --global user.email "bot@fxmega.ug"
          git add active_trades.json || echo "No trades file"
          git diff --quiet && git diff --staged --quiet || git commit -m "Update active trades [bot]"
          git push || echo "No changes to push"