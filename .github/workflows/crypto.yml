name: CRYPTOMEGA Every 2 Hours

on:
  schedule:
    - cron: '0 */2 * * *'  # Every 2 hours UTC = 2am, 4am, 6am... EAT = 5am, 7am, 9am...
  workflow_dispatch:  # Allows manual Run button

jobs:
  run-crypto:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install yfinance pandas requests Pillow pytz

      - name: Run CRYPTOMEGA
        env:
          WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
        run: |
          python cryptomega.py
