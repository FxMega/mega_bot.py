name: CRYPTOMEGA v4 IMAGE BOT

on:
  schedule:
    # Every 2 hours 24/7 - crypto never sleeps!
    - cron: '0 */2 * * *'
  workflow_dispatch:

jobs:
  run-crypto:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install yfinance pandas requests pytz pillow

      - name: Run CRYPTOMEGA v4 with Image API
        env:
          WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
        run: python cryptomega.py
