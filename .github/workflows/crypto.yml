name: CRYPTO BOT 24/7

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install
        run: pip install requests

      - name: Run Bot
        run: python crypto_bot.py

      - name: AUTO SAVE TRADES FILE
        run: |
          git config --global user.name "CryptoBot"
          git config --global user.email "bot@crypto.com"
          git add crypto_trades.json crypto_history.json || echo "no file"
          git diff --quiet && git diff --staged --quiet || git commit -m "Update trades auto [skip ci]"
          git push || echo "nothing to push"
