name: FXMEGA UG BOT
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install yfinance pandas requests pytz ta

      - name: Run python mega_bot.py
        env:
          WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
        run: python mega_bot.py

      - name: Save signals history
        run: |
          git config --global user.name "FXMEGA-BOT"
          git config --global user.email "bot@fxmega.ug"
          git add signals_history.json || echo "no history file yet"
          git commit -m "Update signals history - ${{ github.run_number }}" || echo "no changes to commit"
          git push || echo "push failed"
